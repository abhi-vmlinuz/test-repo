services:
  postgres:
    image: postgres:16-alpine
    container_name: rlabz-postgres
    environment:
      POSTGRES_USER: rlabz
      POSTGRES_PASSWORD: rlabz_dev_password
      POSTGRES_DB: ctf_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rlabz -d ctf_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: rlabz-judge0-server
    restart: always
    privileged: true
    ports:
      - "127.0.0.1:2358:2358"
    environment:
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_password
      - POSTGRES_DB=judge0
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: rlabz-judge0-workers
    restart: always
    privileged: true
    command: ["./scripts/workers"]
    environment:
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_password
      - POSTGRES_DB=judge0
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-db:
    image: postgres:13-alpine
    container_name: rlabz-judge0-db
    restart: always
    environment:
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_password
      - POSTGRES_DB=judge0
    volumes:
      - judge0-db-data:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7-alpine
    container_name: rlabz-judge0-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - judge0-redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rlabz-backend
    network_mode: host
    environment:
      DATABASE_URL: "postgresql://rlabz:rlabz_dev_password@127.0.0.1:5432/ctf_platform"
      JWT_SECRET: "nexus-test-jwt-secret-change-in-prod"
      CORS_ORIGINS: "*"
      NEXUS_ENGINE_URL: "http://127.0.0.1:8081"
      JUDGE0_URL: "http://127.0.0.1:2358"
      GHCR_USERNAME: ""
      GHCR_TOKEN: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ""
        VITE_NEXUS_URL: "http://192.168.122.125:8081"
    container_name: rlabz-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  judge0-db-data:
  judge0-redis-data:
